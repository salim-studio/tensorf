<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="tensorfly banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="wingR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <!-- butterfly mark -->
  <g transform="translate(120,80)">
    <rect x="14" y="26" width="62" height="62" rx="16" fill="url(#wingL)"/>
    <rect x="48" y="94" width="62" height="62" rx="16" fill="url(#wingL)" opacity="0.9"/>
    <rect x="164" y="26" width="62" height="62" rx="16" fill="url(#wingR)"/>
    <rect x="130" y="94" width="62" height="62" rx="16" fill="url(#wingR)" opacity="0.9"/>
    <rect x="112" y="20" width="16" height="148" rx="8" fill="#E0E7FF"/>
    <circle cx="120" cy="12" r="10" fill="#E0E7FF"/>
  </g>
  <!-- wordmark -->
  <text x="400" y="180" font-family="Verdana, Geneva, sans-serif" font-size="96" font-weight="bold" fill="#F8FAFC" letter-spacing="2">tensorfly</text>
  <text x="402" y="235" font-family="Verdana, Geneva, sans-serif" font-size="30" fill="#A5B4FC">TensorFlow-compatible ML, minus the weight.</text>
  <g font-family="Verdana, Geneva, sans-serif" font-size="22" fill="#0F172A" font-weight="bold">
    <rect x="402" y="268" width="150" height="44" rx="22" fill="#22D3EE"/>
    <text x="427" y="297">databases</text>
    <rect x="564" y="268" width="170" height="44" rx="22" fill="#818CF8"/>
    <text x="589" y="297">dataframes</text>
    <rect x="746" y="268" width="190" height="44" rx="22" fill="#F0ABFC"/>
    <text x="771" y="297">deep learning</text>
  </g>
</svg>
